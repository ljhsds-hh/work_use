      continue;
    }
    if (tok.t === "kw") {
      const k = tok.v;
      if (k === "else" || k === "catch" || k === "finally") {
        if (out.length && out[out.length - 1].trim() === "}") {
          out.pop();
          line = "} " + k;
          depth = Math.max(0, depth); // depth already correct
          continue;
        }
        flush();
        line = k;
        continue;
      }
      if (needsSpace()) line += " ";
      else if (/[\s([{]$/.test(line) === false && line === "" && out.length && out[out.length - 1].endsWith("{")) {
        // start on new line already handled by flush before `{`
      }
      if (k === "return" || k === "throw" || k === "case" || k === "new" || k === "typeof" || k === "delete" || k === "void" || k === "in" || k === "of" || k === "instanceof" || k === "await" || k === "yield") {
        line += k + " ";
        continue;
      }
      if (k === "if" || k === "for" || k === "while" || k === "switch" || k === "catch") {
        line += k + " ";
        continue;
      }
      line += k;
      continue;
    }

    const ch = tok.v;

    if (ch === "{") {
      line = line.replace(/\s+$/, "");
      line += line && !line.endsWith("(") ? " {" : "{";
      flush();
      depth++;
      continue;
    }
    if (ch === "}") {
      line = line.replace(/\s+$/, "");
      flush();
      depth = Math.max(0, depth - 1);
      let close = "}";
      const nxt = peekCode(tokens, ti + 1);
      if (nxt && nxt.v === ";") { close += ";"; ti = nxt.idx; }
      else if (nxt && nxt.v === ",") { close += ","; ti = nxt.idx; }
      out.push(IND.repeat(depth) + close);
      continue;
    }
    if (ch === ";") {
      line += ";";
      flush();
      continue;
    }
    if (ch === "(") {
      if (/\b(if|for|while|switch|catch|function|return|await)$/.test(line.trim())) line += "(";
      else if (line && endsWord()) line += "(";
      else line += line.endsWith("(") || line === "" || /[\s([{]$/.test(line) ? "(" : " (";
      paren++;
      continue;
    }
    if (ch === ")") {
      line = line.replace(/\s+$/, "");
      line += ")";
      paren = Math.max(0, paren - 1);
      continue;
    }
    if (ch === ",") {
      line = line.replace(/\s+$/, "");
      line += ", ";
      continue;
    }
    if (ch === "\n") {
      if (/\b(return|throw|break|continue|yield)$/.test(line.trim())) {
        flush();
        continue;
      }
      const nx = peekCode(tokens, ti + 1);
      const nx2 = peekCode(tokens, ti + 2);
      const nextIsInc =
        nx && (nx.v === "++" || nx.v === "--" ||
          ((nx.v === "+" || nx.v === "-") && nx2 && nx2.v === nx.v && nx2.idx === nx.idx + 1));
      if (nextIsInc && /[\w)\]]$/.test(line.trimEnd())) {
        flush();
      }
      continue;
    }
    if (/\s/.test(ch)) continue;

    if (/[=+\-*/%<>!&|^?:.]/.test(ch)) {
      const hadTrailingWs = /\s$/.test(line);
      line = line.replace(/\s+$/, "");
      let op = ch;
      const peekAdj = (from) => {
        const t = tokens[from];
        if (!t || t.t !== "code" || /\s/.test(t.v)) return null;
        return { v: t.v, idx: from, t: t.t };
      };
      const n1 = peekAdj(ti + 1);
      const n2 = peekAdj(ti + 2);
      const p1 = n1 ? n1.v : "";
      const p2 = n2 ? n2.v : "";
      const triple = ch + p1 + p2;
      const pair = ch + p1;

      if (["===", "!==", ">>>", "**=", "<<=", ">>=", "&&=", "||=", "??=", "..."].includes(triple)) {
        op = triple;
        ti += 2;
      } else if (
        ["==", "!=", "<=", ">=", "&&", "||", "??", "?.", "++", "--",
         "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "**", "<<", ">>",
         "=>"].includes(pair) ||
        (ch === "=" && p1 === ">")
      ) {
        op = (ch === "=" && p1 === ">") ? "=>" : pair;
        ti += 1;
      }

      // 属性冒号 {a: 1} 与 case 标签冒号贴身；三元运算符仍走二元空格
      if (op === ":") {
        const isCaseLabel = /^\s*(case|default)\b/.test(line) && !line.includes("?");
        if (isCaseLabel || colonIsProperty(tokens, ti)) {
          line = line.replace(/\s+$/, "");
          line += ": ";
          continue;
        }
      }

      if (hadTrailingWs && /[+\-]$/.test(line) && /^[+\-]/.test(op)) {
        line += " ";
      }
      const tightBefore = (op === "++" || op === "--" || op === "?." || op === ".");
      const needSpaceBefore = !tightBefore && line !== "" && /[\w$)\]"']$/.test(line);
      if (needSpaceBefore) line += " ";
      line += op;

      const tightAfter = new Set([
        "!", "~", "++", "--", "...", "?.", "."
      ]);
      const binaryOps = new Set([
        "=", "+", "-", "*", "/", "%", "|", "&", "^", "?", ":", "<", ">",
        "==", "===", "!=", "!==", "<=", ">=", "&&", "||", "??", "=>",
        "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "**", "<<", ">>",
        "**=", "<<=", ">>=", "&&=", "||=", "??="
      ]);
      if (tightAfter.has(op)) {
        // no space after
      } else if (binaryOps.has(op)) {
        line += " ";
      } else if (op === "!") {
        // unary not
      }
      continue;
    }
    if (needsSpace() && /[\w$]/.test(ch)) line += " ";
    line += ch;
  }
  flush();
  let result = out.join("\n");
  result = result.replace(/\n{3,}/g, "\n\n");
  result = result.replace(/[ \t]+\n/g, "\n");
  result = result.replace(/ +\n/g, "\n");
  return result.trim() + "\n";
}

function peekCode(tokens, from) {
  for (let i = from; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.t === "linec" || t.t === "blockc") continue;
    if (t.t === "code" && /\s/.test(t.v)) continue;
    return { v: t.v, idx: i, t: t.t };
  }
  return null;
}

/* 判断 tokens[from] 处的 `:` 是否为对象字面量属性冒号：
   向前扫，先遇到 `,` 或 `}`（且不在未闭合的 `?` 三元里）即为属性；
   先遇到 `;` ) ] 或裸 `:` 即为三元/标签冒号。字符串、括号与嵌套对象整体跳过。 */
function colonIsProperty(tokens, from) {
  let qDepth = 0, pDepth = 0, bDepth = 0;
  for (let j = from + 1; j < tokens.length; j++) {
    const t = tokens[j];
    if (t.t === "linec" || t.t === "blockc") continue;
    if (t.t === "code" && t.v.length === 1 && /\s/.test(t.v)) continue;
    if (t.t !== "code") continue;
    const v = t.v;
    if (pDepth > 0) { if (v === "(") pDepth++; else if (v === ")") pDepth--; continue; }
    if (bDepth > 0) { if (v === "{") bDepth++; else if (v === "}") bDepth--; continue; }
    if (v === "(") { pDepth = 1; continue; }
    if (v === "{") { bDepth = 1; continue; }
    if (qDepth > 0) { if (v === ":") qDepth--; continue; }
    if (v === "?") { qDepth++; continue; }
    if (v === "," || v === "}") return true;
    if (v === ";" || v === ")") return false;
  }
  return false;
}

function minifyJs(code) {
  const tokens = scanJs(code);
  const WORD = /[\w$]/;
  const restrictedAfter = /\b(return|throw|break|continue|yield)$/;
  const lastCh = s => (s ? s[s.length - 1] : "");

  const seq = [];
  const pushWs = type => {
    const last = seq[seq.length - 1];
    if (last && (last.type === "sp" || last.type === "nl")) {
      if (type === "nl") last.type = "nl";
      return;
    }
    seq.push({ type });
  };
  for (const tok of tokens) {
    if (tok.t === "linec") { pushWs("nl"); continue; }
    if (tok.t === "blockc") { pushWs(tok.v.includes("\n") ? "nl" : "sp"); continue; }
    if (tok.t === "\n" || (tok.t === "code" && tok.v === "\n")) { pushWs("nl"); continue; }
    if (tok.t === "code" && /\s/.test(tok.v)) { pushWs("sp"); continue; }
    if (tok.t === "str" || tok.t === "tpl" || tok.t === "re") { seq.push({ type: "lit", v: tok.v }); continue; }
    if (tok.t === "kw") { seq.push({ type: "kw", v: tok.v }); continue; }
    if (tok.t === "num") { seq.push({ type: "code", v: tok.v }); continue; }
    seq.push({ type: "code", v: tok.v });
  }

  function needSpace(prevStr, atom) {
    if (!prevStr || !atom || !atom.v) return false;
    const prev = lastCh(prevStr);
    const nextV = atom.v;
    const next = nextV[0];
    if (WORD.test(prev) && WORD.test(next)) return true;
    if (prev === "/" && (next === "/" || next === "*")) return true;
    if (prev === "+" && (next === "+" || nextV.startsWith("++"))) return true;
    if (prev === "-" && (next === "-" || nextV.startsWith("--"))) return true;
    if (prev === "/" && atom.type === "lit" && nextV.startsWith("/")) return true;
    if (prev === "/" && atom.type === "lit" && nextV.startsWith("*")) return true;
    return false;
  }

  function keepNewline(prevStr, nextAtom, nextNext) {
    if (!nextAtom) return false;
    const prevTrim = prevStr.trimEnd();
    const nextV0 = nextAtom.v || "";
    if (/\b(break|continue)$/.test(prevTrim) && (nextV0 === "}" || nextV0 === ";")) return false;
    if (restrictedAfter.test(prevTrim)) return true;
    const prev = lastCh(prevStr);
    const nextV = nextAtom.v || "";
    const next = nextV[0] || "";
    if (WORD.test(prev) && WORD.test(next)) return true;
    if (WORD.test(prev) || prev === ")" || prev === "]") {
      if (nextV.startsWith("++") || nextV.startsWith("--")) return true;
      if ((nextV === "+" || nextV === "-") && nextNext && nextNext.type === "code" && nextNext.v === nextV) return true;
    }
    return false;
  }

  let out = "";
  for (let i = 0; i < seq.length; i++) {
    const a = seq[i];
    if (a.type === "sp" || a.type === "nl") {
      let j = i + 1;
      let hadNl = a.type === "nl";
      while (j < seq.length && (seq[j].type === "sp" || seq[j].type === "nl")) {
        if (seq[j].type === "nl") hadNl = true;
        j++;
      }
      if (j >= seq.length) break;
      const next = seq[j];
      if (hadNl && keepNewline(out, next, seq[j + 1])) out += "\n";
      else if (needSpace(out, next)) out += " ";
      i = j - 1;
      continue;
    }
    out += a.v;
  }
  return out.trim();
}

const jsEngine = { format: formatJs, minify: minifyJs };

/* ========== SQL ========== */
const SQL_CLAUSES = [
  "SELECT", "FROM", "WHERE", "GROUP BY", "ORDER BY", "HAVING",
  "LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "FULL JOIN", "CROSS JOIN",
  "LEFT OUTER JOIN", "RIGHT OUTER JOIN", "INNER OUTER JOIN",
  "JOIN", "ON", "UNION ALL", "UNION", "INSERT INTO", "VALUES",
  "UPDATE", "SET", "DELETE FROM", "CREATE TABLE", "ALTER TABLE",
  "DROP TABLE", "WITH", "CASE", "WHEN", "THEN", "ELSE", "END",
  "EXISTS", "LIMIT", "OFFSET", "RETURNING", "DISTINCT", "AS",
  "AND", "OR", "INTO", "PRIMARY KEY", "FOREIGN KEY", "REFERENCES",
  "NOT NULL", "DEFAULT", "INDEX", "BEGIN", "COMMIT", "ROLLBACK"
];

function tokenizeSql(code) {
  const tokens = [];
  let i = 0;
  const n = code.length;
  while (i < n) {
    const ch = code[i];
    if (ch === "-" && code[i + 1] === "-") {
      let j = i;
      while (j < n && code[j] !== "\n") j++;
      tokens.push({ t: "c", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "/" && code[i + 1] === "*") {
      const end = code.indexOf("*/", i + 2);
      const stop = end === -1 ? n : end + 2;
      tokens.push({ t: "c", v: code.slice(i, stop) });
      i = stop;
      continue;
    }
    if (ch === "'" || ch === '"' || ch === "`") {
      let j = i + 1;
      while (j < n) {
        if (code[j] === ch) {
          if (code[j + 1] === ch) { j += 2; continue; }
          j++; break;
        }
        j++;
      }
      tokens.push({ t: "s", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (/[A-Za-z_@#$]/.test(ch)) {
      const m = /^[A-Za-z_@#$][\w$]*/.exec(code.slice(i));
      let word = m[0];
      i += word.length;
      if (code[i] === "." ) {
        let dotted = word;
        while (i < n && code[i] === ".") {
          const m2 = /^[\w$]+/.exec(code.slice(i + 1));
          if (!m2) break;
          dotted += "." + m2[0];
          i += 1 + m2[0].length;
        }
        tokens.push({ t: "id", v: dotted });
        continue;
      }
      tokens.push({ t: "id", v: word });
      continue;
    }
    if (/[0-9]/.test(ch)) {
      const m = /^[\d.]+/.exec(code.slice(i));
      tokens.push({ t: "n", v: m[0] });
      i += m[0].length;
      continue;
    }
    if (/\s/.test(ch)) {
      while (i < n && /\s/.test(code[i])) i++;
      tokens.push({ t: "ws", v: " " });
      continue;
    }
    tokens.push({ t: "p", v: ch });
    i++;
  }
  return tokens;
}

function formatSql(code) {
  const tokens = tokenizeSql(code).filter(t => t.t !== "ws");
  const out = [];
  let line = [];
  let depth = 0;
  let paren = 0;
  const IND = "  ";

  const flush = () => {
    const s = line.join("").replace(/\s+$/, "").trim();
    if (s) out.push(IND.repeat(depth) + s);
    line = [];
  };

  const SQL_MAJOR = [
    "DELETE FROM", "INSERT INTO", "GROUP BY", "ORDER BY", "UNION ALL",
    "LEFT OUTER JOIN", "RIGHT OUTER JOIN", "CROSS JOIN", "LEFT JOIN",
    "RIGHT JOIN", "INNER JOIN", "FULL JOIN", "CREATE TABLE", "ALTER TABLE",
    "DROP TABLE", "SELECT", "FROM", "WHERE", "HAVING", "JOIN", "UNION",
    "VALUES", "UPDATE", "SET", "LIMIT", "OFFSET", "RETURNING", "ON", "WITH"
  ];
  const SQL_KEYWORDS = new Set([
    "SELECT", "DISTINCT", "FROM", "WHERE", "AND", "OR", "NOT", "NULL",
    "GROUP", "BY", "ORDER", "HAVING", "ASC", "DESC", "AS", "ON", "JOIN",
    "LEFT", "RIGHT", "INNER", "FULL", "CROSS", "OUTER", "UNION", "ALL",
    "INSERT", "INTO", "VALUES", "UPDATE", "SET", "DELETE", "CREATE", "TABLE",
    "ALTER", "DROP", "WITH", "CASE", "WHEN", "THEN", "ELSE", "END",
    "EXISTS", "IN", "IS", "LIKE", "BETWEEN", "LIMIT", "OFFSET", "RETURNING",
    "PRIMARY", "FOREIGN", "KEY", "REFERENCES", "DEFAULT", "INDEX",
    "BEGIN", "COMMIT", "ROLLBACK"
  ]);

  function matchClause(idx) {
    let best = null;
    let bestLen = 0;
    for (const c of SQL_MAJOR) {
      const parts = c.split(" ");
      let ti = idx;
      let ok = true;
      for (let k = 0; k < parts.length; k++) {
        const t = tokens[ti];
        if (!t || (t.t !== "id" && t.t !== "p")) { ok = false; break; }
        if (t.v.toUpperCase() !== parts[k].toUpperCase()) { ok = false; break; }
        ti++;
      }
      if (ok && parts.length > bestLen) { best = c; bestLen = parts.length; }
    }
    if (!best) return null;
    return { name: best, len: bestLen };
  }

  let i = 0;
  while (i < tokens.length) {
    const tok = tokens[i];
    if (tok.t === "c") {
      flush();
      for (const l of tok.v.split("\n")) out.push(IND.repeat(depth) + l.trim());
      i++;
      continue;
    }
    if (paren === 0) {
      const m = matchClause(i);
      if (m) {
        const name = m.name;
        const isMajor = [
          "FROM", "WHERE", "GROUP BY", "ORDER BY", "HAVING", "LIMIT",
          "OFFSET", "UNION", "UNION ALL", "ON", "SET", "VALUES",
          "RETURNING", "INSERT INTO", "UPDATE", "DELETE FROM", "CREATE TABLE"
        ].includes(name) || name.endsWith("JOIN");
        flush();
        if (name === "SELECT") {
          out.push(name);
          depth = 1;
        } else if (isMajor) {
          depth = 0;
          out.push(name);
          depth = 1;
        } else {
          out.push(IND.repeat(depth) + name);
        }
        i += m.len;
        continue;
      }
    }
    if (tok.v === "(" && tok.t === "p") {
      if (line.length) {
        const prev = line[line.length - 1];
        if (/[\w'"`)]$/.test(prev) && /^(AND|OR|ON|NOT|IN|VALUES|FROM|WHERE|SET)$/i.test(prev)) line.push(" ");
        else if (/[\w'"`)]$/.test(prev) && /^(COUNT|SUM|AVG|MIN|MAX|COALESCE|IF|IFNULL|CAST|CONVERT|LOWER|UPPER|LENGTH|SUBSTRING|TRIM|NOW|DATE|YEAR|MONTH|EXISTS)$/i.test(prev) === false && !prev.includes("_") && !prev.includes(".")) {
          if (prev.length <= 12 && prev === prev.toLowerCase() && prev !== prev.toUpperCase()) line.push(" ");
        }
      }
      line.push("(");
      paren++;
      i++;
      continue;
    }
    if (tok.v === ")" && tok.t === "p") { line.push(")"); paren = Math.max(0, paren - 1); i++; continue; }
    if (tok.v === "," && tok.t === "p" && paren === 0) { line.push(","); flush(); i++; continue; }
    if (tok.v === ";" && tok.t === "p") { line.push(";"); flush(); i++; continue; }

    let v = tok.v;
    if (tok.t === "id") {
      const up = v.toUpperCase();
      if (SQL_KEYWORDS.has(up)) v = up;
    }

    if (line.length) {
      const prev = line[line.length - 1];
      const wordPrev = /[\w'"`)]$/.test(prev);
      const wordNext = /^[\w'"`(]/.test(v);
      const opPrev = /[=<>!+\-*/%]$/.test(prev);
      const opNext = /^[=<>!+\-*/%]/.test(v);
      let needs = false;
      if (wordPrev && wordNext) needs = true;
      else if (wordPrev && opNext) needs = true;
      else if (opPrev && wordNext) needs = true;
      else if (wordPrev && v === "(" && !/^(COUNT|SUM|AVG|MIN|MAX|COALESCE|IF|IFNULL|CAST|CONVERT|LOWER|UPPER|LENGTH|SUBSTRING|TRIM|NOW|DATE|YEAR|MONTH)$/i.test(prev)) {
        if (prev.toUpperCase() === "AND" || prev.toUpperCase() === "OR" || prev.toUpperCase() === "ON" || prev.toUpperCase() === "NOT" || prev.toUpperCase() === "IN" || prev.toUpperCase() === "VALUES" || prev.toUpperCase() === "SET" || prev.toUpperCase() === "FROM" || prev.toUpperCase() === "WHERE") needs = true;
        else if (/^(a|b|c|x|y|z|t|s|id|name|status|cnt|col|val|user|date|key)$/i.test(prev) === false && prev.length <= 12 && !prev.includes("_") && !prev.includes(".")) needs = true;
      } else if (wordPrev && v === "(") needs = true;
      if (needs) line.push(" ");
    }
    line.push(v);
    i++;
  }
  flush();
  let result = out.join("\n").replace(/\n{3,}/g, "\n\n");
  return result.trim() + "\n";
}

function minifySql(code) {
  const tokens = tokenizeSql(code);
  const WORDISH = /[\w'"`)]/;
  const NEXT_WORDISH = /[\w'"`(]/;
  let out = "";
  let pendingWs = false;
  const lastCh = () => (out ? out[out.length - 1] : "");
  const needSpace = (nextFirst) => {
    const prev = lastCh();
    if (!prev) return false;
    if (WORDISH.test(prev) && NEXT_WORDISH.test(nextFirst)) return true;
    if (/[=<>!+\-*/%]/.test(prev) && /[\w'`(]/.test(nextFirst)) return true;
    if (WORDISH.test(prev) && /[=<>!+\-*/%]/.test(nextFirst)) return true;
    if (prev === "-" && nextFirst === "-") return true;
    if (prev === "/" && (nextFirst === "/" || nextFirst === "*")) return true;
    if (prev === nextFirst && /[+\-*/=<>]/.test(prev)) return true;
    return false;
  };
  for (const tok of tokens) {
    if (tok.t === "c") continue;
    if (tok.t === "ws") { pendingWs = true; continue; }
    if (pendingWs) {
      pendingWs = false;
      if (out && needSpace(tok.v[0] || "")) out += " ";
    }
    out += tok.v;
  }
  return out.trim();
}

const sqlEngine = { format: formatSql, minify: minifySql };

/* ========== C# / Java 共用大括号格式化 ========== */
/* 判断 tokens[from] 处的 `<` 是否为泛型实参表开头：向前扫描配对的 `>`，
   遇到 ( ) ; { } 或运算符即判负（那就是比较符）。`, . ?` 在实参表内合法。 */
function isGenericStart(tokens, from) {
  let d = 1;
  for (let j = from + 1; j < tokens.length; j++) {
    const t = tokens[j];
    if (t.t === "linec" || t.t === "blockc") continue;
    if (t.t === "code" && t.v.length === 1 && /\s/.test(t.v)) continue;
    if (t.t === "code") {
      if (t.v === "<") { d++; continue; }
      if (t.v === ">") { d--; if (d === 0) return true; continue; }
      if (t.v === "," || t.v === "." || t.v === "?") continue;
      if (/^[\w]$/.test(t.v)) continue; // Java 扫描器逐字符出 token，字母也是 code
      return false;
    }
    if (t.t === "kw" || t.t === "str") continue;
    return false;
  }
  return false;
}

/* 判断 tokens[from] 处的 `?` 是否为 C# 可空类型/条件访问标记：向前扫，
   先碰到 `:` 判为三元运算符，先碰到 `;` `{` `}` 或扫到结尾判为可空。
   （`?.` 已在配对合并时先行处理，这里只看裸 `?`） */
function isNullableMark(tokens, from) {
  for (let j = from + 1; j < tokens.length; j++) {
    const t = tokens[j];
    if (t.t === "linec" || t.t === "blockc") continue;
    if (t.t === "code" && t.v.length === 1 && /\s/.test(t.v)) continue;
    if (t.t === "code") {
      if (t.v === ":") return false;
      if (t.v === ";" || t.v === "{" || t.v === "}") return true;
      continue;
    }
  }
  return true;
}

/* 后跟 `)`/`]` 时需要补空格的控制流关键字（if(x)return 不能排成 if(x)return） */
const BRACE_CTRL_KW = /^(return|throw|break|continue|goto|yield)$/;

function formatBraceLang(code, opts) {
  const tokens = opts.scan(code);
  const out = [];
  let line = "";
  let depth = 0;
  let paren = 0;
  let bracket = 0;
  let generic = 0;
  let lastWasWs = false;

  const flush = () => {
    const t = line.trim();
    if (t) out.push((opts.indent || "    ").repeat(depth) + t);
    line = "";
    lastWasWs = false;
  };

  for (let ti = 0; ti < tokens.length; ti++) {
    const tok = tokens[ti];
    if (tok.t === "linec") {
      flush();
      out.push((opts.indent || "    ").repeat(depth) + tok.v.trim());
      continue;
    }
    if (tok.t === "blockc") {
      if (!tok.v.includes("\n")) {
        if (line.trim()) line += " " + tok.v;
        else { flush(); out.push((opts.indent || "    ").repeat(depth) + tok.v); }
      } else {
        flush();
        const ind = (opts.indent || "    ").repeat(depth);
        for (const l of tok.v.split("\n")) out.push(l.trim() ? ind + l.trim() : "");
      }
      continue;
    }
    if (tok.t === "str" || tok.t === "tpl") { line += tok.v; continue; }

    const ch = tok.v;
    if (ch === "{") {
      line = line.replace(/\s+$/, "");
      line += (line && !line.endsWith("(") ? " " : "") + "{";
      flush();
      depth++;
      continue;
    }
    if (ch === "}") {
      line = line.replace(/\s+$/, "");
      flush();
      depth = Math.max(0, depth - 1);
      let close = "}";
      let next = nextCodeToken(tokens, ti + 1);
      // }; ) ] 收尾链跟 } 同行（如 lambda 结尾的 }); ）
      while (next && (next.v === ")" || next.v === "]")) {
        close += next.v;
        ti = next.idx;
        next = nextCodeToken(tokens, ti + 1);
      }
      if (next && next.v === ";") { close += ";"; ti = next.idx; }
      else if (next && next.v === ",") { close += ","; ti = next.idx; }
      else if (next && (next.v === "else" || next.v === "catch" || next.v === "finally" || next.v === "while")) {
        // 不直接 push：留在 line 上，让后续 ( 等自然拼成 } catch (…) { 一行
        line = "} " + next.v;
        ti = next.idx;
        continue;
      }
      out.push((opts.indent || "    ").repeat(depth) + close);
      continue;
    }
    if (ch === ";") {
      line = line.replace(/\s+$/, "");
      line += paren > 0 ? "; " : ";";
      // 括号内的分号（for 循环头部）不拆行
      if (paren === 0) flush();
      continue;
    }
    // 仅泛型闭合（>）后的 ( 收紧：List<int>()；其余保留既有空格（x = (a + b)）
    if (ch === "(") { if (/>$/.test(line)) line = line.replace(/\s+$/, ""); line += "("; paren++; continue; }
    if (ch === ")") { line = line.replace(/\s+$/, ""); line += ")"; paren = Math.max(0, paren - 1); continue; }
    if (ch === "[") { line += "["; bracket++; continue; }
    if (ch === "]") { line = line.replace(/\s+$/, ""); line += "]"; bracket = Math.max(0, bracket - 1); continue; }
    if (ch === ",") {
      line = line.replace(/\s+$/, "");
      line += ", ";
      continue;
    }
    if (ch === "\n") {
      if (/\b(return|throw|break|continue|yield)$/.test(line.trim()) ||
          /^@[\w.]+(\s*\([^)]*\))?$/.test(line.trim())) {
        flush();
        lastWasWs = false;
        continue;
      }
      if (line && !/\s$/.test(line)) line += " ";
      lastWasWs = line.endsWith(" ") || line === "";
      continue;
    }
    if (/\s/.test(ch)) {
      if (line && !/\s$/.test(line)) line += " ";
      lastWasWs = line.endsWith(" ") || line === "";
      continue;
    }
    if (ch === "<" && isGenericStart(tokens, ti)) {
      // 不 trim：List<int> 本就紧贴，public <T> 的合法空格要保留
      line += "<";
      generic++;
      lastWasWs = false;
      continue;
    }
    if (ch === ">" && generic > 0) {
      line = line.replace(/\s+$/, "");
      line += ">";
      generic--;
      lastWasWs = false;
      continue;
    }
    if (/[=+\-*/%<>!&|^?:.~]/.test(ch)) {
      const hadTrailingWs = /\s$/.test(line);
      const prevTight = line.replace(/\s+$/, "");
      let op = ch;
      const peekAdj = (from) => {
        const t = tokens[from];
        return (t && t.t === "code" && !/\s/.test(t.v)) ? t.v : null;
      };
      const p1 = peekAdj(ti + 1);
      const p2 = peekAdj(ti + 2);
      // 复合运算符合并；泛型实参表内不合并以 < > 开头的组合（>> 是两层闭合）
      if (!(generic > 0 && (ch === "<" || ch === ">"))) {
        const triple = ch + (p1 || "") + (p2 || "");
        const pair = ch + (p1 || "");
        if (["<<=", ">>=", ">>>=", "??="].includes(triple)) { op = triple; ti += 2; }
        else if (["==", "!=", "<=", ">=", "&&", "||", "??", "?.", "++", "--",
                  "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "=>", "->",
                  "<<", ">>", ">>>", "::"].includes(pair)) { op = pair; ti += 1; }
      }

      const isIncDec = op === "++" || op === "--";
      const operandBefore = /[\w)\]"']$/.test(prevTight);
      const tight = op === "." || op === "?." || op === "::" ||
        (generic > 0 && (op === "?" || op === ":")) ||
        // case 1: / default: 的标签冒号（该行没有 ? 说明不是三元）
        (op === ":" && /^(case|default)\b/.test(prevTight) && !prevTight.includes("?"));

      // C# 可空类型/条件访问的裸 ?（int? x、a?[0]）：贴在前一个类型/标识符后；
      // 向前扫不到「:」而先碰到 ; { } 就判为可空，否则是三元运算符
      if (op === "?" && !hadTrailingWs && operandBefore && isNullableMark(tokens, ti)) {
        line = prevTight + "?";
        lastWasWs = false;
        continue;
      }
      // 后缀 ++ / -- 贴在操作数后
      if (isIncDec && !hadTrailingWs && operandBefore) {
        line = prevTight + op;
        lastWasWs = false;
        continue;
      }
      // 一元前缀：! ~，以及前面没有操作数的 + - *
      const unaryPrefix =
        op === "!" || op === "~" ||
        ((op === "+" || op === "-" || op === "*" || op === "&") && !operandBefore);
      if (unaryPrefix) {
        // x++ 之后再来一个 -（即 x++ + -y 这类）不能连成 +++，先隔开
        if (line && /[+\-]$/.test(line) && /^[+\-]$/.test(op)) line += " ";
        else if (line && !/[\s([{]$/.test(line)) line += " ";
        line += op;
        lastWasWs = false;
        continue;
      }
      if (tight) {
        line = line.replace(/\s+$/, "");
        line += op;
        // case 1: / default: 标签冒号后补空格，让后续语句空开
        if (op === ":" && /^(case|default)\b/.test(prevTight) && !prevTight.includes("?")) line += " ";
        lastWasWs = false;
        continue;
      }
      // 二元 / 赋值类：两侧空格（前导空格靠条件补，不重复已有空白）
      if (line && !/[\s([{.]$/.test(line)) line += " ";
      line += op;
      if (!["!", "~", "++", "--"].includes(op)) line += " ";
      lastWasWs = false;
      continue;
    }
    if (tok.t === "kw" && BRACE_CTRL_KW.test(ch) && /[)\]]$/.test(line)) line += " ";
    // 泛型闭合（List<int>）之后跟单词要补空格（List<int> x）
    if ((tok.t === "kw" || (tok.t === "code" && /[\w$]/.test(ch))) && />$/.test(line)) line += " ";
    line += ch;
    lastWasWs = false;
  }
  flush();
  let result = out.join("\n");
  result = result.replace(/\n{3,}/g, "\n\n");
  result = result.replace(/[ \t]+\n/g, "\n");
  return result.trim() + "\n";
}

function nextCodeToken(tokens, from) {
  for (let i = from; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.t === "linec" || t.t === "blockc") continue;
    if (t.t === "code" && /\s/.test(t.v)) continue;
    if (t.t === "kw") return { v: t.v, idx: i };
    if (t.t === "code") return { v: t.v, idx: i };
    return { v: t.v, idx: i };
  }
  return null;
}

function minifyBraceLang(code, opts) {
  const tokens = opts.scan(code);
  const WORD = /[\w$]/;
  const restrictedAfter = /\b(return|throw|break|continue|yield)$/;
  const lastCh = s => (s ? s[s.length - 1] : "");
  const kws = opts.spaceKeywords ? new Set(opts.spaceKeywords) : null;

  const seq = [];
  const pushWs = type => {
    const last = seq[seq.length - 1];
    if (last && (last.type === "sp" || last.type === "nl")) {
      if (type === "nl") last.type = "nl";
      return;
    }
    seq.push({ type });
  };
  for (const tok of tokens) {
    if (tok.t === "linec") { pushWs("nl"); continue; }
    if (tok.t === "blockc") { pushWs(tok.v.includes("\n") ? "nl" : "sp"); continue; }
    if (tok.t === "code" && tok.v === "\n") { pushWs("nl"); continue; }
    if (tok.t === "code" && /^\s+$/.test(tok.v)) { pushWs(tok.v.includes("\n") ? "nl" : "sp"); continue; }
    if (tok.t === "str" || tok.t === "tpl") { seq.push({ type: "lit", v: tok.v }); continue; }
    seq.push({ type: tok.t === "kw" ? "kw" : "code", v: tok.v });
  }

  function needSpace(prevStr, atom) {
    if (!prevStr || !atom || !atom.v) return false;
    const prev = lastCh(prevStr);
    const nextV = atom.v;
    const next = nextV[0];
    if (WORD.test(prev) && WORD.test(next)) return true;
    if (prev === ">" && WORD.test(next)) return true; // List<int> x 不能压成 List<int>x
    if (prev === "/" && (next === "/" || next === "*")) return true;
    if (prev === "+" && (next === "+" || nextV.startsWith("++"))) return true;
    if (prev === "-" && (next === "-" || nextV.startsWith("--"))) return true;
    if (prev === "/" && atom.type === "lit" && (nextV.startsWith("/") || nextV.startsWith("*"))) return true;
    if (kws && atom.type === "kw" && kws.has(nextV) && /[\w)]$/.test(prevStr)) return true;
    if (kws && prevStr.match(/(?:^|\s)([A-Za-z_]\w*)$/) && kws.has(prevStr.match(/([A-Za-z_]\w*)$/)[1]) && WORD.test(next)) return true;
    return false;
  }

  function keepNewline(prevStr, nextAtom, nextNext) {
    if (!nextAtom) return false;
    if (restrictedAfter.test(prevStr.trimEnd())) return true;
    const prev = lastCh(prevStr);
    const nextV = nextAtom.v || "";
    const next = nextV[0] || "";
    if (WORD.test(prev) && WORD.test(next)) return true;
    if (WORD.test(prev) || prev === ")" || prev === "]") {
      if (nextV.startsWith("++") || nextV.startsWith("--")) return true;
      if ((nextV === "+" || nextV === "-") && nextNext && nextNext.type === "code" && nextNext.v === nextV) return true;
    }
    if ((prev === ")" || prev === "]") && next === "(") return true;
    if ((prev === ")" || prev === "]") && /^[A-Za-z_$]/.test(nextV)) return true;
    return false;
  }

  let out = "";
  for (let i = 0; i < seq.length; i++) {
    const a = seq[i];
    if (a.type === "sp" || a.type === "nl") {
      let j = i + 1;
      let hadNl = a.type === "nl";
      while (j < seq.length && (seq[j].type === "sp" || seq[j].type === "nl")) {
        if (seq[j].type === "nl") hadNl = true;
        j++;
      }
      if (j >= seq.length) break;
      const next = seq[j];
      if (hadNl && keepNewline(out, next, seq[j + 1])) out += "\n";
      else if (needSpace(out, next)) out += " ";
      i = j - 1;
      continue;
    }
    out += a.v;
  }
  return out.trim();
}

const csEngine = {
  format(code) {
    if (/#\s*(if|elif|else|endif|define|undef|warning|error|region|endregion|pragma)/.test(code) || /^\s*#/m.test(code)) {
      return formatWithDirectives(code, csScan);
    }
    return formatBraceLang(code, { scan: csScan, indent: "    " });
  },
  minify(code) {
    return minifyBraceLang(code, {
      scan: csScan,
      spaceKeywords: ["return", "new", "using", "namespace", "public", "private", "protected", "static", "class", "var", "int", "void", "bool", "if", "else", "for", "foreach", "while", "this", "null", "true", "false", "throw", "try", "catch", "finally", "in", "is", "as", "typeof", "sizeof", "default", "switch", "case", "break", "continue", "get", "set", "async", "await", "yield"]
    });
  }
};

const javaEngine = {
  format(code) { return formatBraceLang(code, { scan: scanCStyle, indent: "    " }); },
  minify(code) {
    return minifyBraceLang(code, {
      scan: scanCStyle,
      spaceKeywords: ["return", "new", "import", "package", "public", "private", "protected", "static", "class", "int", "void", "boolean", "if", "else", "for", "while", "this", "null", "true", "false", "throw", "try", "catch", "finally", "extends", "implements", "instanceof", "switch", "case", "break", "continue", "super", "final", "interface", "enum"]
    });
  }
};

function formatWithDirectives(code, scan) {
  const lines = code.split("\n");
  const kept = lines.map(l => l.replace(/\s+$/, ""));
  const joined = kept.join("\n");
  return formatBraceLang(joined, { scan, indent: "    " });
}

function csScan(code) {
  const tokens = [];
  let i = 0;
  const n = code.length;
  while (i < n) {
    const ch = code[i];
    if (ch === "/" && code[i + 1] === "/") {
      let j = i;
      while (j < n && code[j] !== "\n") j++;
      tokens.push({ t: "linec", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "/" && code[i + 1] === "*") {
      const end = code.indexOf("*/", i + 2);
      const stop = end === -1 ? n : end + 2;
      tokens.push({ t: "blockc", v: code.slice(i, stop) });
      i = stop;
      continue;
    }
    if (ch === '"') {
      if (i > 0 && code[i - 1] === "@") {
        let j = i + 1;
        while (j < n) {
          if (code[j] === '"' && code[j + 1] === '"') { j += 2; continue; }
          if (code[j] === '"') { j++; break; }
          j++;
        }
        tokens.push({ t: "str", v: code.slice(i, j) });
        i = j;
        continue;
      }
      let j = i + 1;
      while (j < n) {
        if (code[j] === "\\") { j += 2; continue; }
        if (code[j] === '"') { j++; break; }
        j++;
      }
      tokens.push({ t: "str", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "'") {
      let j = i + 1;
      while (j < n) {
        if (code[j] === "\\") { j += 2; continue; }
        if (code[j] === "'") { j++; break; }
        j++;
      }
      tokens.push({ t: "str", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "$" && code[i + 1] === '"') {
      let j = i + 2;
      let depthB = 0;
      while (j < n) {
        if (code[j] === "\\") { j += 2; continue; }
        if (code[j] === "{") depthB++;
        if (code[j] === "}") { if (depthB > 0) depthB--; else { j++; break; } }
        if (code[j] === '"' && depthB === 0) { j++; break; }
        j++;
      }
      tokens.push({ t: "str", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "#") {
      let j = i;
      while (j < n && code[j] !== "\n") j++;
      tokens.push({ t: "linec", v: code.slice(i, j) });
      i = j;
      continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      const m = /^[A-Za-z_]\w*/.exec(code.slice(i));
      tokens.push({ t: "kw", v: m[0] });
      i += m[0].length;
      continue;
    }
    tokens.push({ t: "code", v: ch });
    i++;
  }
  return tokens;
}

/* ========== 引擎注册 ========== */
const engines = {
  json: jsonEngine,
  html: htmlEngine,
  xml: xmlEngine,
  xaml: xamlEngine,
  css: cssEngine,
  js: jsEngine,
  sql: sqlEngine,
  cs: csEngine,
  java: javaEngine
};

/* ========== UI ========== */
const $ = id => document.getElementById(id);
const inputEl = $("input");
const outputEl = $("output");
const statusEl = $("status");
const statusTextEl = $("statusText") || statusEl;
const langSel = $("langSel");
const btnTheme = $("btnTheme");
const themeIcon = $("themeIcon");
const themeLabel = $("themeLabel");

function currentTheme() {
  return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
}

function syncThemeUI() {
  const t = currentTheme();
  if (themeIcon) themeIcon.textContent = t === "light" ? "☀" : "☾";
  if (themeLabel) themeLabel.textContent = t === "light" ? "浅色" : "深色";
  if (btnTheme) btnTheme.setAttribute("aria-label", "切换主题，当前：" + (t === "light" ? "浅色" : "深色"));
}

function applyTheme(theme, persist) {
  const t = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  if (persist !== false) {
    try { localStorage.setItem("forge-theme", t); } catch (e) { /* ignore */ }
  }
  syncThemeUI();
}

applyTheme(currentTheme(), false);

if (btnTheme) {
  btnTheme.addEventListener("click", () => {
    applyTheme(currentTheme() === "light" ? "dark" : "light");
    setStatus("已切换到" + (currentTheme() === "light" ? "浅色" : "深色") + "主题。", "ok");
  });
}

try {
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: light)");
    const onScheme = () => {
      let saved = null;
      try { saved = localStorage.getItem("forge-theme"); } catch (e) { /* ignore */ }
      if (saved !== "light" && saved !== "dark") applyTheme(mq.matches ? "light" : "dark", false);
    };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }
} catch (e) { /* ignore */ }

/* ========== 行号 / 行高亮 ========== */
function countLines(text) {
  if (text === "" || text == null) return 1;
  let n = 1;
  for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
  return n;
}

function lineOfIndex(text, index) {
  let line = 0;
  const e = Math.max(0, Math.min(index | 0, text.length));
  for (let i = 0; i < e; i++) if (text.charCodeAt(i) === 10) line++;
  return line;
}

function getLineRanges(text, start, end, focused) {
  text = text == null ? "" : String(text);
  const len = text.length;
  let s = Math.max(0, Math.min(start | 0, len));
  let e = Math.max(0, Math.min(end | 0, len));
  if (e < s) { const tmp = s; s = e; e = tmp; }
  const caret = lineOfIndex(text, s);
  const active = focused ? [caret] : [];
  const selected = [];
  if (e > s) {
    let ls = lineOfIndex(text, s);
    let le = lineOfIndex(text, e);
    if (e > 0 && text.charCodeAt(e - 1) === 10 && le > ls) le -= 1;
    for (let L = ls; L <= le; L++) selected.push(L);
  }
  return { caret, active, selected };
}

function createEditor(textarea, gutterInner, hlInner) {
  const ed = { textarea, gutterInner, hlInner, lineH: 22, padTop: 16, raf: 0 };

  function measure() {
    ed.lineH = 22;
    ed.padTop = 16;
    if (!textarea || typeof getComputedStyle !== "function") return;
    try {
      const cs = getComputedStyle(textarea);
      let lh = parseFloat(cs.lineHeight);
      if (!lh || Number.isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.65;
      if (lh && !Number.isNaN(lh)) ed.lineH = lh;
      const pt = parseFloat(cs.paddingTop);
      if (pt && !Number.isNaN(pt)) ed.padTop = pt;
    } catch (e) { /* ignore */ }
  }

  function syncScroll() {
    if (!textarea) return;
    const t = "translateY(" + (-textarea.scrollTop || 0) + "px)";
    if (gutterInner && gutterInner.style) gutterInner.style.transform = t;
    if (hlInner && hlInner.style) hlInner.style.transform = t;
  }

  function renderGutter() {
    if (!gutterInner) return;
    const n = countLines(textarea ? textarea.value : "");
    if (ed.gutterLines === n && gutterInner.textContent) return;
    ed.gutterLines = n;
    let s = "";
    for (let i = 1; i <= n; i++) {
      s += i;
      if (i < n) s += "\n";
    }
    gutterInner.textContent = s;
  }

  function coalesceRanges(nums) {
    if (!nums.length) return [];
    const out = [];
    let a = nums[0];
    let b = nums[0];
    for (let i = 1; i < nums.length; i++) {
      if (nums[i] === b + 1) { b = nums[i]; continue; }
      out.push([a, b]);
      a = b = nums[i];
    }
    out.push([a, b]);
    return out;
  }

  function renderHl() {
    if (!hlInner) return;
    measure();
    const text = textarea ? textarea.value : "";
    const focused = typeof document !== "undefined" && document.activeElement === textarea;
    const start = textarea ? textarea.selectionStart : 0;
    const end = textarea ? textarea.selectionEnd : 0;
    const ranges = getLineRanges(text, start, end, focused);
    let html = "";
    for (let i = 0; i < ranges.active.length; i++) {
      const top = ed.padTop + ranges.active[i] * ed.lineH;
      html += '<div class="hl-line hl-active" style="top:' + top + 'px;height:' + ed.lineH + 'px"></div>';
    }
    const spans = coalesceRanges(ranges.selected);
    for (let i = 0; i < spans.length; i++) {
      const top = ed.padTop + spans[i][0] * ed.lineH;
      const h = (spans[i][1] - spans[i][0] + 1) * ed.lineH;
      html += '<div class="hl-line hl-selected" style="top:' + top + 'px;height:' + h + 'px"></div>';
    }
    hlInner.innerHTML = html;
  }

  function render() {
    renderGutter();
    renderHl();
    syncScroll();
  }

  function schedule() {
    if (ed.raf) return;
    const run = () => { ed.raf = 0; render(); };
    if (typeof requestAnimationFrame === "function") ed.raf = requestAnimationFrame(run);
    else if (typeof setTimeout === "function") ed.raf = setTimeout(run, 16);
    else run();
  }

  if (textarea && typeof textarea.addEventListener === "function") {
    textarea.addEventListener("scroll", syncScroll, { passive: true });
    textarea.addEventListener("input", schedule);
    textarea.addEventListener("change", schedule);
    textarea.addEventListener("keyup", schedule);
    textarea.addEventListener("mouseup", schedule);
    textarea.addEventListener("click", schedule);
    textarea.addEventListener("focus", schedule);
    textarea.addEventListener("blur", schedule);
  }

  ed.render = render;
  ed.schedule = schedule;
  measure();
  render();
  return ed;
}

const editorInstances = [
  createEditor(inputEl, $("gutterInput"), $("hlInput")),
  createEditor(outputEl, $("gutterOutput"), $("hlOutput"))
];

function refreshEditors() {
  for (let i = 0; i < editorInstances.length; i++) editorInstances[i].render();
}

if (document.addEventListener) {
  document.addEventListener("selectionchange", function () {
    const ae = document.activeElement;
    for (let i = 0; i < editorInstances.length; i++) {
      if (editorInstances[i].textarea === ae) editorInstances[i].schedule();
    }
  });
}

/* ========== 自定义背景 ========== */
const BG_KEY = "forge-bg";
const btnBg = $("btnBg");
const bgPanel = $("bgPanel");
const bgColorIn = $("bgColor");
const bgImageIn = $("bgImage");
const bgOpacityIn = $("bgOpacity");
const bgOpacityVal = $("bgOpacityVal");
const bgGlassIn = $("bgGlass");
const bgGlassVal = $("bgGlassVal");
const bgBlurIn = $("bgBlur");
const bgBlurVal = $("bgBlurVal");
const bgCustomEl = $("bgCustom");
const btnBgPick = $("btnBgPick");
const bgFileIn = $("bgFile");
const bgImgName = $("bgImgName");
const btnBgClearImg = $("btnBgClearImg");
let bgLocalData = "";

function normalizeBg(raw) {
  const cfg = { color: "#0a0e13", image: "", opacity: 100, glass: 38, blur: 4 };
  if (raw && typeof raw === "object") {
    if (typeof raw.color === "string" && /^#[0-9a-fA-F]{3,8}$/.test(raw.color)) cfg.color = raw.color;
    if (typeof raw.image === "string") cfg.image = raw.image;
    if (raw.opacity != null && raw.opacity !== "") {
      const n = Number(raw.opacity);
      if (!Number.isNaN(n)) cfg.opacity = Math.max(0, Math.min(100, Math.round(n)));
    }
    if (raw.glass != null && raw.glass !== "") {
      const g = Number(raw.glass);
      if (!Number.isNaN(g)) cfg.glass = Math.max(0, Math.min(100, Math.round(g)));
    }
    if (raw.blur != null && raw.blur !== "") {
      const b = Number(raw.blur);
      if (!Number.isNaN(b)) cfg.blur = Math.max(0, Math.min(40, Math.round(b)));
    }
  }
  return cfg;
}

function loadBg() {
  try {
    const s = localStorage.getItem(BG_KEY);
    if (!s) return null;
    return normalizeBg(JSON.parse(s));
  } catch (e) { return null; }
}

function saveBg(cfg) {
  try { localStorage.setItem(BG_KEY, JSON.stringify(normalizeBg(cfg))); } catch (e) { /* ignore */ }
}

function applyBg(cfg, active) {
  const root = document.documentElement;
  const c = normalizeBg(cfg);
  const rootStyle = root && root.style;
  if (!bgCustomEl || !bgCustomEl.style) {
    if (active) root.setAttribute("data-custom-bg", "1");
    else root.removeAttribute("data-custom-bg");
    return;
  }
  if (!active) {
    root.removeAttribute("data-custom-bg");
    if (rootStyle) {
      if (rootStyle.removeProperty) {
        rootStyle.removeProperty("--bg-glass");
        rootStyle.removeProperty("--bg-blur");
      } else {
        try { rootStyle["--bg-glass"] = ""; rootStyle["--bg-blur"] = ""; } catch (e) { /* ignore */ }
      }
    }
    bgCustomEl.style.opacity = "0";
    bgCustomEl.style.backgroundColor = "transparent";
    bgCustomEl.style.backgroundImage = "none";
    return;
  }
  root.setAttribute("data-custom-bg", "1");
  if (rootStyle && rootStyle.setProperty) {
    rootStyle.setProperty("--bg-glass", String(c.glass / 100));
    rootStyle.setProperty("--bg-blur", c.blur + "px");
  } else if (rootStyle) {
    try { rootStyle["--bg-glass"] = String(c.glass / 100); rootStyle["--bg-blur"] = c.blur + "px"; } catch (e) { /* ignore */ }
  }
  bgCustomEl.style.opacity = String(c.opacity / 100);
  bgCustomEl.style.backgroundColor = c.color || "#0a0e13";
  bgCustomEl.style.backgroundImage = c.image
    ? 'url("' + String(c.image).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '")'
    : "none";
}

function effectiveBgImage() {
  const url = bgImageIn ? bgImageIn.value.trim() : "";
  if (url) return url;
  return bgLocalData || "";
}

function syncBgForm(cfg) {
  const c = normalizeBg(cfg);
  if (bgColorIn) bgColorIn.value = c.color;
  if (c.image.startsWith("data:")) {
    bgLocalData = c.image;
    if (bgImageIn) bgImageIn.value = "";
    if (bgImgName) bgImgName.textContent = "本地图片已启用";
  } else {
    bgLocalData = "";
    if (bgImageIn) bgImageIn.value = c.image;
    if (bgImgName) bgImgName.textContent = "";
  }
  if (bgOpacityIn) bgOpacityIn.value = String(c.opacity);
  if (bgOpacityVal) bgOpacityVal.textContent = c.opacity + "%";
  if (bgGlassIn) bgGlassIn.value = String(c.glass);
  if (bgGlassVal) bgGlassVal.textContent = c.glass + "%";
  if (bgBlurIn) bgBlurIn.value = String(c.blur);
  if (bgBlurVal) bgBlurVal.textContent = c.blur + "px";
}

function setBgPanel(open) {
  if (!bgPanel || !btnBg) return;
  if (open) {
    bgPanel.removeAttribute("hidden");
    if (bgColorIn && typeof bgColorIn.focus === "function") bgColorIn.focus();
  } else {
    bgPanel.setAttribute("hidden", "");
  }
  btnBg.setAttribute("aria-expanded", open ? "true" : "false");
}

function currentBgForm() {
  return normalizeBg({
    color: bgColorIn ? bgColorIn.value : "#0a0e13",
    image: effectiveBgImage(),
    opacity: bgOpacityIn ? Number(bgOpacityIn.value) : 100,
    glass: bgGlassIn ? Number(bgGlassIn.value) : 38,
    blur: bgBlurIn ? Number(bgBlurIn.value) : 4
  });
}

function commitBg() {
  const cfg = currentBgForm();
  saveBg(cfg);
  applyBg(cfg, true);
  if (bgOpacityVal) bgOpacityVal.textContent = cfg.opacity + "%";
  if (bgGlassVal) bgGlassVal.textContent = cfg.glass + "%";
  if (bgBlurVal) bgBlurVal.textContent = cfg.blur + "px";
}

function shrinkBgImage(dataUrl, cb) {
  if (typeof Image !== "function" || typeof document.createElement !== "function") {
    cb(dataUrl);
    return;
  }
  const img = new Image();
  img.onload = function () {
    try {
      const maxSide = 1920;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const tooBig = w > maxSide || h > maxSide || dataUrl.length > 1.5e6;
      if (!tooBig) { cb(dataUrl); return; }
      const scale = Math.min(1, maxSide / Math.max(w, h, 1));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) { cb(dataUrl); return; }
      ctx.drawImage(img, 0, 0, w, h);
      let out = "";
      try { out = canvas.toDataURL("image/jpeg", 0.82); } catch (e) { out = ""; }
      if (!out || out.length > 2.2e6) {
        try { out = canvas.toDataURL("image/jpeg", 0.65); } catch (e) { out = ""; }
      }
      cb(out || dataUrl);
    } catch (e) {
      cb(dataUrl);
    }
  };
  img.onerror = function () { cb(dataUrl); };
  img.src = dataUrl;
}

function applyBgFile(file) {
  if (!file) return;
  if (typeof FileReader !== "function") {
    setStatus("当前环境不支持读取本地文件。", "warn");
    return;
  }
  if (file.type && !/^image\//.test(file.type)) {
    setStatus("请选择图片文件（PNG / JPG / WebP 等）。", "warn");
    return;
  }
  const reader = new FileReader();
  reader.onload = function () {
    const raw = String(reader.result || "");
    if (!raw.startsWith("data:image")) {
      setStatus("图片读取失败。", "err");
      return;
    }
    shrinkBgImage(raw, function (dataUrl) {
      bgLocalData = dataUrl;
      if (bgImageIn) bgImageIn.value = "";
      if (bgImgName) bgImgName.textContent = file.name ? ("已选：" + file.name) : "本地图片已启用";
      commitBg();
      setStatus("已应用本地背景图片。", "ok");
      if (bgFileIn && "value" in bgFileIn) bgFileIn.value = "";
    });
  };
  reader.onerror = function () {
    setStatus("读取图片失败。", "err");
  };
  reader.readAsDataURL(file);
}

(function initBg() {
  const saved = loadBg();
  if (saved) {
    syncBgForm(saved);
    applyBg(saved, true);
  } else {
    syncBgForm(normalizeBg(null));
    applyBg(normalizeBg(null), false);
  }
  setBgPanel(false);

  if (btnBg && bgPanel) {
    btnBg.addEventListener("click", function (e) {
      e.stopPropagation();
      setBgPanel(bgPanel.hasAttribute("hidden"));
    });
    document.addEventListener("click", function (e) {
      if (bgPanel.hasAttribute("hidden")) return;
      if (bgPanel.contains(e.target) || btnBg.contains(e.target)) return;
      setBgPanel(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setBgPanel(false);
    });
  }
  if (btnBgPick && bgFileIn) {
    btnBgPick.addEventListener("click", function (e) {
      e.stopPropagation();
      if (typeof bgFileIn.click === "function") bgFileIn.click();
    });
    bgFileIn.addEventListener("change", function () {
      const files = bgFileIn.files;
      if (files && files.length) applyBgFile(files[0]);
    });
  }
  if (btnBgClearImg) {
    btnBgClearImg.addEventListener("click", function (e) {
      e.stopPropagation();
      bgLocalData = "";
      if (bgImageIn) bgImageIn.value = "";
      if (bgImgName) bgImgName.textContent = "";
      if (bgFileIn && "value" in bgFileIn) bgFileIn.value = "";
      commitBg();
      setStatus("已移除背景图片。", "ok");
    });
  }
  if (bgColorIn) bgColorIn.addEventListener("input", commitBg);
  if (bgImageIn) bgImageIn.addEventListener("change", commitBg);
  if (bgOpacityIn) bgOpacityIn.addEventListener("input", commitBg);
  if (bgGlassIn) bgGlassIn.addEventListener("input", commitBg);
  if (bgBlurIn) bgBlurIn.addEventListener("input", commitBg);
})();

function setStatus(msg, kind) {
  statusTextEl.textContent = msg;
  statusEl.className = "statusbar" + (kind ? " " + kind : "");
}

function pulseAxis() {
  document.body.classList.remove("is-working");
  void document.body.offsetWidth;
  document.body.classList.add("is-working");
  setTimeout(() => document.body.classList.remove("is-working"), 750);
}

function resolveLang() {
  const sel = langSel.value;
  if (sel !== "auto") return sel;
  const detected = detectLanguage(inputEl.value);
  if (!detected) {
    setStatus("未识别，请从下拉框选择语言", "warn");
    return null;
  }
  setStatus("已识别：" + LANG_NAMES[detected], "ok");
  return detected;
}

function runOp(op) {
  const src = inputEl.value;
  if (!src.trim()) {
    setStatus("输入为空，请先粘贴或输入代码。", "warn");
    return;
  }
  const lang = resolveLang();
  if (!lang) return;
  try {
    const engine = engines[lang];
    if (!engine) throwErr("不支持的语言：" + lang);
    const result = op === "format" ? engine.format(src) : engine.minify(src);
    outputEl.value = result;
    refreshEditors();
    pulseAxis();
    setStatus((op === "format" ? "已格式化" : "已压缩") + "：" + LANG_NAMES[lang] + "（" + result.length + " 字符）", "ok");
  } catch (e) {
    outputEl.value = "";
    refreshEditors();
    setStatus((op === "format" ? "格式化" : "压缩") + "失败：" + e.message, "err");
  }
}

function refreshDetect() {
  if (langSel.value !== "auto") return;
  const text = inputEl.value;
  if (!text.trim()) {
    setStatus("粘贴或输入代码，点击「格式化」或「压缩」。", "");
    return;
  }
  const d = detectLanguage(text);
  if (d) setStatus("已识别：" + LANG_NAMES[d], "ok");
  else setStatus("未识别，请从下拉框选择语言", "warn");
}

$("btnFormat").addEventListener("click", () => runOp("format"));
$("btnMinify").addEventListener("click", () => runOp("minify"));

$("btnClear").addEventListener("click", () => {
  inputEl.value = "";
  outputEl.value = "";
  langSel.value = "auto";
  refreshEditors();
  setStatus("已清除。", "");
  inputEl.focus();
});

$("btnCopy").addEventListener("click", async () => {
  const text = outputEl.value;
  if (!text) { setStatus("输出为空，没有可复制的内容。", "warn"); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      outputEl.removeAttribute("readonly");
      outputEl.select();
      document.execCommand("copy");
      outputEl.setAttribute("readonly", "");
      window.getSelection().removeAllRanges();
    }
    setStatus("已复制输出到剪贴板。", "ok");
  } catch (e) {
    outputEl.removeAttribute("readonly");
    outputEl.select();
    try {
      document.execCommand("copy");
      setStatus("已复制输出到剪贴板。", "ok");
    } catch (e2) {
      setStatus("复制失败，请手动选中输出后 Ctrl+C。", "err");
    }
    outputEl.setAttribute("readonly", "");
  }
});

$("btnPaste").addEventListener("click", async () => {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setStatus("剪贴板为空。", "warn");
        return;
      }
      inputEl.value = text;
      refreshEditors();
      refreshDetect();
      setStatus("已粘贴到输入栏。", "ok");
      return;
    }
    throw new Error("no clipboard api");
  } catch (e) {
    setStatus("无法读取剪贴板，请在输入栏按 Ctrl+V 手动粘贴。", "warn");
    inputEl.focus();
  }
});

langSel.addEventListener("change", () => {
  if (langSel.value === "auto") refreshDetect();
  else setStatus("已选择：" + LANG_NAMES[langSel.value], "ok");
});

let detectTimer = null;
inputEl.addEventListener("input", () => {
  clearTimeout(detectTimer);
  detectTimer = setTimeout(refreshDetect, 200);
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runOp("format");
  } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "M" || e.key === "m")) {
    e.preventDefault();
    runOp("minify");
  } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "L" || e.key === "l")) {
    e.preventDefault();
    $("btnClear").click();
  } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "D" || e.key === "d")) {
    e.preventDefault();
    if (btnTheme) btnTheme.click();
  }
});

/* 暴露给控制台测试 */
window.__fmt = {
  detectLanguage,
  engines,
  LANG_NAMES,
  applyTheme,
  currentTheme,
  countLines,
  getLineRanges,
  normalizeBg,
  loadBg,
  applyBg,
  refreshEditors,
  applyBgFile
};
</script>
</body>
